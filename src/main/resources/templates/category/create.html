<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div class="container">
            <div class="page-head">
                <div class="kicker">Amministrazione</div>
                <h1>Nuova sezione</h1>
                <p>Le sezioni compaiono nella barra di navigazione del giornale.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="paper-card">
                        <form th:action="@{/categories}" method="post" th:object="${category}">
                            <div class="mb-4">
                                <label for="name" class="form-label">Nome della sezione</label>
                                <input id="name" type="text" class="form-control" th:field="*{name}" maxlength="50"
                                    placeholder="es. cultura">
                                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></p>
                            </div>
                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/dashboard}" class="btn btn-outline-ink">Annulla</a>
                                <button type="submit" class="btn btn-ink">Crea sezione</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
