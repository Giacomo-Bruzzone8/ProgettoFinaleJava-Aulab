<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div class="container">
            <div class="page-head">
                <div class="kicker">Candidatura</div>
                <h1 th:text="${request.user.username}">Nome utente</h1>
                <p>
                    <span th:text="${request.user.email}">email</span> · si candida come
                    <strong th:text="${@ui.roleLabel(request.role.name)}">ruolo</strong>
                </p>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="paper-card">
                        <div class="form-label">Lettera di presentazione</div>
                        <div class="article-body m-0" style="font-size: 1.08rem;">
                            <p th:each="paragraph : ${@ui.paragraphs(request.body)}" th:text="${paragraph}">Testo</p>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between gap-2 mt-4">
                        <a th:href="@{/admin/dashboard}" class="btn btn-outline-ink">
                            <i class="fa-solid fa-arrow-left"></i> Torna all'amministrazione
                        </a>
                        <form th:action="@{/operations/career/request/accept/{id}(id=${request.id})}" method="post">
                            <button type="submit" class="btn btn-success-ink"><i class="fa-solid fa-check"></i> Accetta candidatura</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
