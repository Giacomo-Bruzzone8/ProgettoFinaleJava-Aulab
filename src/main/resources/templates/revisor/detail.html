<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div class="container">
            <div class="flash mt-4" role="note">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Bozza in revisione: leggila e decidi se pubblicarla.</span>
            </div>
        </div>

        <article class="container">
            <header class="article-head">
                <div class="kicker" th:text="${article.category != null ? article.category.name : 'Senza categoria'}">Categoria</div>
                <h1 th:text="${article.title}">Titolo</h1>
                <p class="standfirst" th:text="${article.subtitle}">Sottotitolo</p>
                <div class="byline">
                    <span class="avatar" th:text="${@ui.initials(article.user.username)}">AB</span>
                    <div class="meta">
                        di <span th:text="${article.user.username}">Autore</span><br>
                        <span th:text="${@ui.date(article.publishDate)}">data</span><span class="sep">·</span><span
                            th:text="${@ui.readingMinutes(article.body) + ' min di lettura'}">3 min</span>
                    </div>
                </div>
            </header>

            <figure class="article-figure">
                <div class="figure-frame wide">
                    <img th:src="${@ui.cover(article)}" th:attr="data-fallback=${@ui.generatedCover(article)}"
                        th:alt="${article.title}">
                </div>
            </figure>

            <div class="article-body">
                <p th:each="paragraph : ${@ui.paragraphs(article.body)}" th:text="${paragraph}">Testo</p>
            </div>

            <div class="article-end">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                    <a th:href="@{/revisor/dashboard}" class="btn btn-outline-ink">
                        <i class="fa-solid fa-arrow-left"></i> Torna alla lista
                    </a>
                    <div class="d-flex gap-2">
                        <form th:action="@{/articles/accept(action='reject', articleId=${article.id})}" method="post">
                            <button type="submit" class="btn btn-accent"><i class="fa-solid fa-xmark"></i> Rifiuta</button>
                        </form>
                        <form th:action="@{/articles/accept(action='accept', articleId=${article.id})}" method="post">
                            <button type="submit" class="btn btn-success-ink"><i class="fa-solid fa-check"></i> Pubblica</button>
                        </form>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
