<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div th:replace="~{index :: flash}"></div>

        <div class="container">
            <div class="page-head">
                <div class="kicker">Scrivania del revisore</div>
                <h1>Articoli da revisionare</h1>
                <p th:text="${articles.isEmpty() ? 'Nessun articolo in attesa.' : (articles.size() == 1 ? '1 articolo attende il tuo giudizio.' : articles.size() + ' articoli attendono il tuo giudizio.')}">In attesa</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-10">
                    <div th:each="article : ${articles}" class="story-row">
                        <a th:href="@{/articles/revisor/detail/{id}(id=${article.id})}" class="figure-frame d-block">
                            <img th:src="${@ui.cover(article)}" th:attr="data-fallback=${@ui.generatedCover(article)}"
                                th:alt="${article.title}" loading="lazy">
                        </a>
                        <div>
                            <div class="kicker" th:text="${article.category != null ? article.category.name : 'Senza categoria'}">Categoria</div>
                            <a th:href="@{/articles/revisor/detail/{id}(id=${article.id})}"><h3 th:text="${article.title}">Titolo</h3></a>
                            <p th:text="${article.subtitle}">Sottotitolo</p>
                            <div class="meta mb-3">
                                di <span th:text="${article.user.username}">Autore</span><span class="sep">·</span><span
                                    th:text="${@ui.date(article.publishDate)}">data</span>
                            </div>
                            <a th:href="@{/articles/revisor/detail/{id}(id=${article.id})}" class="btn btn-ink">Leggi e valuta</a>
                        </div>
                    </div>

                    <div class="empty-state" th:if="${articles.isEmpty()}">
                        <h2>Tutto revisionato</h2>
                        <p>Non ci sono articoli in attesa. Ottimo lavoro.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
