<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-7">
                    <div class="page-head border-0 mb-0">
                        <div class="kicker">Abbonati, è gratis</div>
                        <h1>Crea il tuo account</h1>
                        <p>Registrati per candidarti come redattore o revisore.</p>
                    </div>

                    <div class="paper-card mt-3">
                        <form th:action="@{/register/save}" th:object="${user}" method="post" novalidate>
                            <div class="row g-3">
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="firstName">Nome</label>
                                    <input class="form-control" id="firstName" th:field="*{firstName}" type="text"
                                        autocomplete="given-name">
                                    <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="field-error"></p>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label" for="lastName">Cognome</label>
                                    <input class="form-control" id="lastName" th:field="*{lastName}" type="text"
                                        autocomplete="family-name">
                                    <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="field-error"></p>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="email">Email</label>
                                    <input class="form-control" id="email" th:field="*{email}" type="email"
                                        placeholder="nome@esempio.it" autocomplete="email">
                                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></p>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="password">Password</label>
                                    <input class="form-control" id="password" th:field="*{password}" type="password"
                                        autocomplete="new-password">
                                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></p>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-ink w-100 mt-4">Registrati</button>
                        </form>
                    </div>

                    <p class="meta text-center mt-4">Hai già un account?
                        <a th:href="@{/login}">Accedi</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
