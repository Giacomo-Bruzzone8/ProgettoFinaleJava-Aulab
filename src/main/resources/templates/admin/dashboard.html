<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div th:replace="~{index :: flash}"></div>

        <div class="container">
            <div class="page-head">
                <div class="kicker">Amministrazione</div>
                <h1>La direzione</h1>
                <p>Candidature in arrivo e sezioni del giornale.</p>
            </div>

            <div class="row g-5">
                <section class="col-12 col-lg-7">
                    <h2 class="section-title mt-0">Candidature da valutare</h2>
                    <div class="table-responsive" th:if="${!requests.isEmpty()}">
                        <table class="ledger">
                            <thead>
                                <tr>
                                    <th>Candidato</th>
                                    <th>Ruolo richiesto</th>
                                    <th class="text-end">Azioni</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="request : ${requests}">
                                    <td class="title-cell" th:text="${request.user.username}">Utente</td>
                                    <td><span class="status wait" th:text="${@ui.roleLabel(request.role.name)}">Ruolo</span></td>
                                    <td class="actions">
                                        <a th:href="@{/operations/career/request/detail/{id}(id=${request.id})}"
                                            class="btn btn-ink">Valuta</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="empty-state py-5" th:if="${requests.isEmpty()}">
                        <h2>Nessuna candidatura</h2>
                        <p class="mb-0">Quando qualcuno si candida, la trovi qui.</p>
                    </div>
                </section>

                <section class="col-12 col-lg-5">
                    <h2 class="section-title mt-0">Sezioni</h2>
                    <table class="ledger">
                        <tbody>
                            <tr th:each="category : ${categories}">
                                <td class="title-cell text-capitalize" th:text="${category.name}">Categoria</td>
                                <td class="actions">
                                    <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-outline-ink btn-icon"
                                        title="Modifica" aria-label="Modifica"><i class="fa-solid fa-pen"></i></a>
                                    <a th:href="@{/categories/delete/{id}(id=${category.id})}" class="btn btn-accent btn-icon"
                                        title="Elimina" aria-label="Elimina"
                                        onclick="return confirm('Eliminare la sezione? Gli articoli resteranno senza categoria.');">
                                        <i class="fa-solid fa-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/categories/create}" class="btn btn-ink mt-3"><i class="fa-solid fa-plus"></i> Nuova sezione</a>
                </section>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
