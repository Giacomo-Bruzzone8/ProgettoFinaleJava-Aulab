<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div class="container">
            <div class="page-head">
                <div class="kicker">Redazione · modifica</div>
                <h1 th:text="${article.title}">Titolo</h1>
                <p>Le modifiche vengono salvate subito.</p>
            </div>

            <div class="row justify-content-center g-4">
                <div class="col-12 col-lg-8">
                    <div class="paper-card">
                        <form th:action="@{/articles/update/{id}(id=${article.id})}" method="post" th:object="${article}"
                            enctype="multipart/form-data">
                            <th:block th:replace="~{article/form :: fields}"></th:block>
                            <div class="d-flex flex-wrap gap-2 justify-content-end">
                                <a th:href="@{/writer/dashboard}" class="btn btn-outline-ink">Annulla</a>
                                <button type="submit" class="btn btn-ink">Salva le modifiche</button>
                            </div>
                        </form>
                    </div>
                </div>
                <aside class="col-12 col-lg-4">
                    <div class="form-label">Copertina attuale</div>
                    <div class="figure-frame">
                        <img th:src="${@ui.cover(article)}" th:attr="data-fallback=${@ui.generatedCover(article)}"
                            th:alt="${article.title}">
                    </div>
                    <p class="form-hint mt-2" th:if="${!@ui.hasUploadedImage(article.image)}">
                        Nessuna immagine caricata: viene mostrata l'illustrazione della sezione.
                    </p>
                </aside>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
