<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div th:replace="~{index :: flash}"></div>

        <div class="container">
            <div class="page-head">
                <div class="kicker">Archivio</div>
                <h1 th:text="${title}">Tutti gli articoli</h1>
                <p th:if="${param.keyword}" th:text="${'Risultati per «' + param.keyword + '»'}">Risultati</p>
                <p th:text="${articles.size() == 1 ? '1 articolo' : articles.size() + ' articoli'}">12 articoli</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-10">
                    <div th:if="${articles.size() > 0}">
                        <th:block th:each="article : ${articles}">
                            <a th:replace="~{index :: storyRow(${article})}"></a>
                        </th:block>
                    </div>

                    <div class="empty-state" th:unless="${articles.size() > 0}">
                        <h2>Nessun articolo trovato</h2>
                        <p class="mb-4">Prova con un'altra ricerca o sfoglia una delle sezioni.</p>
                        <a th:href="@{/articles}" class="btn btn-ink">Vai all'archivio</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
