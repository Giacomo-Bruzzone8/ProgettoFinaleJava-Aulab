<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<!-- Campi condivisi dai form di creazione e modifica articolo (richiede th:object="${article}") -->

<body>
    <th:block th:fragment="fields">
        <div class="mb-4">
            <label for="articleTitle" class="form-label">Titolo</label>
            <input type="text" id="articleTitle" class="form-control form-control-lg" th:field="*{title}"
                maxlength="100" placeholder="Un titolo che si legga in un colpo d'occhio"
                style="font-family: var(--font-display); font-weight: 700;">
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="field-error"></p>
        </div>

        <div class="mb-4">
            <label for="subtitle" class="form-label">Sottotitolo</label>
            <input type="text" id="subtitle" class="form-control" th:field="*{subtitle}" maxlength="100"
                placeholder="Una riga che spieghi perché vale la pena leggerlo" style="font-style: italic;">
            <p th:if="${#fields.hasErrors('subtitle')}" th:errors="*{subtitle}" class="field-error"></p>
        </div>

        <div class="mb-4">
            <label for="body" class="form-label">Testo</label>
            <textarea id="body" class="form-control" th:field="*{body}" maxlength="1000"
                placeholder="Scrivi qui l'articolo. Lascia una riga vuota per iniziare un nuovo paragrafo."></textarea>
            <div class="d-flex justify-content-between">
                <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}" class="field-error"></p>
                <span class="form-hint ms-auto mt-1">Massimo 1000 caratteri</span>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
                <label for="date" class="form-label">Data di pubblicazione</label>
                <input type="date" id="date" class="form-control" th:field="*{publishDate}">
                <p th:if="${#fields.hasErrors('publishDate')}" th:errors="*{publishDate}" class="field-error"></p>
            </div>
            <div class="col-12 col-md-6">
                <label for="category" class="form-label">Sezione</label>
                <select id="category" th:field="*{category}" class="form-select">
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                </select>
                <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="field-error"></p>
            </div>
        </div>

        <div class="mb-4">
            <label for="image" class="form-label">Immagine di copertina</label>
            <input type="file" name="file" id="image" class="form-control" accept="image/*">
            <span class="form-hint">Facoltativa: senza immagine la redazione genera un'illustrazione per la sezione.</span>
        </div>
    </th:block>
</body>

</html>
