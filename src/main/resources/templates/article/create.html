<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:insert="~{index :: head}"></head>
<body>
    <head th:insert="~{index :: navbar}"></head>

    <div class="vh-100">
        <div class="container">
            <div class="row">

                <div class="col-12 my-5 d-flex justify-content-between align-items-center">
                    <div class="d-flex justify-content-center aling-items-center flex-grow-1">
                        <h1 th:text="${title}">Inserisci un articolo</h1>
                    </div>
                </div>

                <div class="col-12 my-5">
                    <form th:action="@{/articles}" method="POST" th:object="${article}" enctype="multypart/form-data">
                        <div class="row mb-3">
                            <div class="col">
                                <label for="articleTitle" class="form-label">Titolo</label>
                                <input id="articleTitle" type="text" class="form-control" th:field="*{title}" placeholder="inserici un articolo...">
                                <p th:errors = "*{subtitle}" class="text-danger" th:if="${#fields.hasErrors('title')}"></p>
                            </div>
                            <div class="col">
                                <label for="subtitle" class="form-label">Sottotitolo</label>
                                <input id="subtitle" type="text" class="form-control" th:field="*{subtitle}" placeholder="inserici un sottotitolo...">
                                <p th:errors = "*{subtitle}" class="text-danger" th:if="${#fields.hasErrors('subtitle')}"></p>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="date" class="form-label">Publish date(8 chars)</label>
                            <input id="date" type="date" class="form-control" th:field="*{publishDate}" placeholder="yyyyMMdd">
                            <p th:errors = "*{publishDate}" class="text-danger" th:if="${#fields.hasErrors('publishDate')}"></p>
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" th:field="*{category}" class="form-select">
                                <option th:each="category:${categories}" th:value="${category.id}"
                                th:text="${category.name}"></option>
                                <p th:errors="*{category}" class="text-danger" th:if="${#fields.hasErrors('category')}"></p>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="image" class="form-label">Image</label>
                            <input type="file" name="file" id="image" class="form-control">
                        </div>

                        <button type="submit" class="btn btn-success">Crea Articolo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <head th:insert="~{index ::footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
