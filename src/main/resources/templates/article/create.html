<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <div class="container">
            <div class="page-head">
                <div class="kicker">Redazione</div>
                <h1>Scrivi un articolo</h1>
                <p>Dopo l'invio, un revisore lo leggerà prima della pubblicazione.</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-12 col-lg-9">
                    <div class="paper-card">
                        <form th:action="@{/articles}" method="post" th:object="${article}" enctype="multipart/form-data">
                            <th:block th:replace="~{article/form :: fields}"></th:block>
                            <div class="d-flex flex-wrap gap-2 justify-content-end">
                                <a th:href="@{/writer/dashboard}" class="btn btn-outline-ink">Annulla</a>
                                <button type="submit" class="btn btn-ink">
                                    <i class="fa-solid fa-paper-plane"></i> Invia in revisione
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
